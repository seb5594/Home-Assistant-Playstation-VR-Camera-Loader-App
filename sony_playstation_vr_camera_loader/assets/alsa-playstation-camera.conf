# ALSA PCM that records the camera microphone through PulseAudio.
# Copy it into another app's container together with libasound2-plugins and
# access to the PulseAudio socket, then record from "sony_playstation_vr_camera_input".
pcm.sony_playstation_vr_camera_input {
    type pulse
    device sony_playstation_vr_camera_input
    hint {
        show on
        ioid Input
        description "USB Sony PlayStation VR Camera Microphone"
    }
}
